/* === Lively animations === */
html{scroll-behavior:smooth}
body{overflow-x:hidden}
nav{animation:navDrop .7s cubic-bezier(.2,.8,.2,1) both;position:relative;z-index:5}
.logo{transition:transform .3s ease,text-shadow .3s ease}.logo:hover{transform:scale(1.04) rotate(-1deg);text-shadow:0 0 22px rgba(245,167,215,.5)}
.navlinks a{position:relative;transition:color .25s ease,transform .25s ease}.navlinks a:hover{transform:translateY(-2px);color:#fff}.navlinks a::after{content:"";position:absolute;left:50%;bottom:-7px;width:0;height:2px;border-radius:99px;background:linear-gradient(90deg,#f5a7d7,#c8b4ff);transform:translateX(-50%);transition:width .25s ease}.navlinks a:hover::after{width:100%}
.hero,.wrap,.page{animation:fadeUp .9s cubic-bezier(.2,.8,.2,1) both}
.badge{animation:floaty 3s ease-in-out infinite,glowPulse 3s ease-in-out infinite}
.gradient{background-size:200% auto;animation:gradientFlow 5s ease-in-out infinite}
.btn,.back,.about-button .button-label{position:relative;overflow:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,filter .22s ease}
.btn::before,.back::before,.about-button .button-label::before{content:"";position:absolute;top:-80%;left:-35%;width:30%;height:260%;background:rgba(255,255,255,.28);transform:rotate(25deg) translateX(-180px);transition:transform .55s ease;pointer-events:none}
.btn:hover,.back:hover,.about-button:hover .button-label{transform:translateY(-4px) scale(1.025);box-shadow:0 12px 30px rgba(0,0,0,.25);filter:brightness(1.08)}
.btn:hover::before,.back:hover::before,.about-button:hover .button-label::before{transform:rotate(25deg) translateX(520px)}
.btn:active,.back:active,.about-button:active .button-label{transform:translateY(1px) scale(.98)}
.card,.panel,.rules,.box{transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease,background .3s ease;animation:cardIn .7s cubic-bezier(.2,.8,.2,1) both}
.card:hover,.panel:hover,.rules:hover,.box:hover{transform:translateY(-7px);box-shadow:0 18px 45px rgba(0,0,0,.24);border-color:rgba(245,167,215,.38);background-color:rgba(255,255,255,.075)}
.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.2s}.card:nth-child(4){animation-delay:.3s}.card:nth-child(5){animation-delay:.4s}.card:nth-child(6){animation-delay:.5s}
.icon{display:inline-block;animation:iconBob 3.2s ease-in-out infinite}.card:nth-child(2) .icon{animation-delay:.25s}.card:nth-child(3) .icon{animation-delay:.5s}
section{animation:sectionRise .9s .15s both}
.hero p,.header p{animation:fadeUp .8s .25s both}
footer{transition:background .3s ease}.about-button{transition:transform .25s ease,box-shadow .25s ease}.about-button:hover{box-shadow:0 18px 45px rgba(0,0,0,.25)}
